# ==============================================================================
# Nginx Configuration for Tectra Hub Biometric & Management System
# Target Server: /etc/nginx/sites-available/hrms.tectratechnologies.com
#
# DUAL SETUP:
# 1. Plain HTTP (Port 80) for eSSL Biometric Push (/iclock/*) - NO HTTPS REDIRECT
# 2. HTTPS (Port 443) with SSL for Frontend REST API & WebSockets
# ==============================================================================

# --- 1. HTTP Server (Port 80) ---
server {
    listen 80;
    listen [::]:80;
    server_name hrms.tectratechnologies.com 157.173.218.57;

    # CRITICAL FOR eSSL / ZKTeco Biometric Devices:
    # Devices DO NOT follow 301/302 redirects to HTTPS, nor do they support SNI TLS.
    # Route /iclock directly to backend port 5001 over plain HTTP.
    location ~* ^/(iclock|api/iclock|api/biometric/adms) {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering so streaming/chunked punches are ingested immediately
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 20M;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # All non-biometric HTTP traffic redirects to secure HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 2. HTTPS Server (Port 443) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hrms.tectratechnologies.com;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/hrms.tectratechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrms.tectratechnologies.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # Biometric endpoints over HTTPS (fallback if device or proxy uses HTTPS)
    location ~* ^/(iclock|api/iclock|api/biometric/adms) {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # WebSocket (Socket.io) real-time notifications for Frontend
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API and default backend proxying
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
